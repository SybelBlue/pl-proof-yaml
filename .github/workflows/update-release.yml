name: Update release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: update-release
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.6"
          python-version: "3.13"
          enable-cache: true

      - name: Install development tools
        run: uv sync --locked --only-dev

      - name: Verify vendored dependencies
        run: uv run --locked --no-sync pl-vendor check installed

      - name: Fetch the current release branch
        run: git fetch origin refs/heads/release:refs/remotes/origin/release || true

      - name: Rebuild and push release
        run: uv run --locked --no-sync pl-vendor release build --push
